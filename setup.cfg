[flake8]
format = wemake
show-source = true
doctests = true
statistics = false

# Plugins:
max-complexity = 6
max-line-length = 80
max-try-body-length = 2
max-local-variables = 8

extend-exclude =
  .venv

select = WPS

per-file-ignores =
  # There are multiple assert`s, and subprocesses in tests:
  tests/*.py: WPS226
